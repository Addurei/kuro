name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt offscreen libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes app main.py
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
